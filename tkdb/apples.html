window.onload = function() {
    // Attach onchange listeners
    document.getElementById('a').addEventListener('change', calculate);
    document.getElementById('b').addEventListener('change', calculate);
    document.getElementById('check').addEventListener('change', calculate);

    // Call the function to calculate initial values
    calculate();
};

function calculate() {
    var levelA = parseInt(document.getElementById('a').value);
    var levelB = parseInt(document.getElementById('b').value);
    var totalApples = 0;
    var totalGapples = 0;

    // Validate input
    if (levelA < 1 || levelB > 200 || isNaN(levelA) || isNaN(levelB) || levelA >= levelB) {
        document.getElementById('apple').innerHTML = '';
        document.getElementById('gapple').innerHTML = '';
        return; // Exit the function if the levels are invalid
    }

    // Loop through levels to sum apples and gapples
    for (var i = levelA; i < levelB; i++) {
        totalApples += numbers[i][1];  // apples are in the second column        
        if (i < levelB - 1 || document.getElementById('check').checked) {
            totalGapples += numbers[i][2]; // gapples are in the third column
        }
    }

    // Update the output fields
    document.getElementById('apple').innerHTML = totalApples;
    document.getElementById('gapple').innerHTML = totalGapples;
}
